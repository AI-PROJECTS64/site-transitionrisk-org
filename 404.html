<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TransitionRisk.org — Page not found</title>
  <meta name="robots" content="noindex, nofollow" />
  <style>
    :root{
      --bg:#020815;
      --card:#081120;
      --muted:#8791b0;
      --text:#e8eefc;
      --accent:#7fd0ff;
      --shadow:0 10px 30px rgba(0,0,0,.45);
      --radius:18px;
    }
    *{box-sizing:border-box}
    html,body{
      margin:0;
      padding:0;
      background:var(--bg);
      color:var(--text);
      font:15px/1.6 system-ui,-apple-system,Segoe UI,Roboto,Inter,Ubuntu,Arial,sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    a{color:var(--accent);text-decoration:none}
    a:hover{text-decoration:underline}
    .wrap{
      max-width:640px;
      margin:0 auto;
      padding:40px 24px 48px;
    }
    .card{
      background:var(--card);
      border-radius:var(--radius);
      border:1px solid #1d2946;
      padding:28px 24px 26px;
      box-shadow:var(--shadow);
      text-align:left;
    }
    h1{
      margin:0 0 10px;
      font-size:26px;
    }
    p{margin:8px 0;color:var(--muted);}
    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:9px 16px;
      border-radius:999px;
      border:1px solid #21325b;
      background:#122143;
      color:#e8eefc;
      font-size:14px;
      cursor:pointer;
      margin-top:14px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="card">
      <h1>Page not found / Page introuvable</h1>
      <p>
        The page you were looking for could not be found.
        It may have been moved, renamed or may no longer exist.
      </p>
      <p>
        La page que vous recherchez est introuvable.
        Elle a peut-être été déplacée, renommée ou supprimée.
      </p>
      <a class="btn" href="/">← Back to TransitionRisk.org</a>
    </section>
  </div>
</body>
</html>
